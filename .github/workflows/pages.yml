name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Seite zusammenstellen (nur ausgelieferte Dateien)
        run: |
          mkdir _site
          cp -r index.html impressum.html datenschutz.html danke.html robots.txt assets _site/
          find _site -name 'README.txt' -delete
          # Cache-Busting: ?v=dev in den HTML-Dateien durch den Commit-Hash ersetzen,
          # damit Browser nach jedem Deploy das aktuelle CSS/JS laden
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/*.html
          touch _site/.nojekyll

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
